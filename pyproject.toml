[project]
name = "machinelens"
version = "0.1.0"
description = "Library for ML/AI explainability"
authors = [{ name="Fabrício Vaz" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "lime>=0.2.0.1",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "kaleido>=1.1.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.3.2",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "__init__.py",
    "tests",
    "*/tests/*",
    "*/__init__.py",
    "src/**/*.egg-info"
]

[tool.ruff.lint]
# E (Pycodestyle Error), F (Pyflakes), W (Pycodestyle Warning), I (Isort), D (Pydocstyle), B (Bugbear)
select = ["E", "F", "W", "I", "D", "B"]
# D100: Missing docstring in public module
# D104: Missing docstring in public package
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
addopts = "--cov=src --cov-report=term-missing"
