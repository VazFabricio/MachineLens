name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install black isort flake8 mypy pytest pre-commit

    - name: Install docstring tools
      run: |
        pip install pydocstyle darglint flake8-docstrings

    - name: Check docstrings with pydocstyle (Google)
      run: |
        pydocstyle src --convention=google

    - name: Check docstrings match signature with darglint
      run: |
        # darglint falha se houver mismatch; opcional: rode só em CI
        darglint src || (echo "darglint failed" && exit 1)

    - name: Lint with black
      run: black --check src tests

    - name: Check imports with isort
      run: isort --check-only src tests

    - name: Lint with flake8
      run: flake8 src tests

    - name: Run mypy
      run: mypy src --ignore-missing-imports

    - name: Run tests
      run: pytest tests
