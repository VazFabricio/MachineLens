name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala o MachineLens e todas as ferramentas de dev (pytest-cov, ruff, etc.)
        pip install -e ".[dev]"

    - name: Run pre-commit
      run: |
        # O pre-commit às vezes precisa instalar os próprios hooks na primeira vez
        pre-commit run --all-files

    - name: Run tests
      run: pytest tests
